<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行業資訊｜五豐行情</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>

<main class="container">
  <h1 class="page-title">行業資訊</h1>
  <p class="page-sub">每日更新｜全部資訊均附原始來源連結及發布日期，來源涵蓋官方機構、權威媒體及行業協會｜按分類瀏覽或輸入關鍵字搜尋</p>

  <div class="filter-bar">
    <div class="search-box">
      <input type="text" id="q" placeholder="搜尋關鍵字，例如：雞翼、關稅、三文魚、巴西…">
      <button class="btn" id="btn-search">搜尋</button>
    </div>
  </div>
  <div class="filter-bar" id="cat-bar"></div>

  <!-- 資訊工具列：手動刷新＋狀態顯示 -->
  <div class="news-toolbar">
    <button class="btn btn-sm" id="btn-refresh">重新整理資訊</button>
    <span id="refresh-status" class="refresh-status"></span>
    <span id="unread-count" class="unread-count"></span>
  </div>
  <div id="news-error" class="notice err news-error" style="display:none;">
    <span id="news-error-msg"></span>
    <button class="btn btn-sm btn-grey" id="btn-retry">重試</button>
  </div>

  <p id="result-count" style="font-size:.85rem;color:#666;margin-bottom:12px;"></p>
  <div id="news-list"></div>

  <!-- 新聞來源清單 -->
  <div class="card" id="sources-card" style="margin-top:30px;">
    <h2 id="sources-toggle" style="cursor:pointer;">新聞來源清單（含國際來源）　<span id="sources-arrow" style="float:right;font-size:.9rem;color:var(--ice);">展開 ▼</span></h2>
    <div id="sources-body" style="display:none;"></div>
  </div>
</main>

<footer class="footer" id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/sources.js"></script>
<script src="js/common.js"></script>
<script src="js/news.js"></script>
</body>
</html>
